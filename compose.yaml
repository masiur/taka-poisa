# Self-hosting: `docker compose up -d`, then open BASE_URL and create the owner account.
# Set POSTGRES_PASSWORD (and BASE_URL when running behind a domain) in a .env file next to this one.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takapoisa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takapoisa}
      POSTGRES_DB: takapoisa
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takapoisa -d takapoisa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://takapoisa:${POSTGRES_PASSWORD:-takapoisa}@db:5432/takapoisa?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Email for reminders (any SMTP provider). Without SMTP_HOST, reminders are planned but not sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Taka Poisa}
      SMTP_TLS: ${SMTP_TLS:-}
      # SMS reminders through your own gateway (optional). See README.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      SMS_HTTP_CONTENT_TYPE: ${SMS_HTTP_CONTENT_TYPE:-}
      SMS_HTTP_SUCCESS: ${SMS_HTTP_SUCCESS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
